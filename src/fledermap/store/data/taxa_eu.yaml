# European bat taxa and the Wildlife Acoustics codes the Echo Meter Touch emits.
#
# Codes are verified against the authoritative Wildlife Acoustics list:
# https://answers.wildlifeacoustics.com/r/en-US/Bat-Auto-ID-Performance-and-Supported-Species/Bat-Auto-ID-Supported-Species-and-Abbreviated-Codes
#
# That list is SPECIES-LEVEL ONLY — it defines no genus or group codes. Do not
# invent one. An unmapped label resolves to None and lands in the review queue
# by design (spec section 5), which is a far better failure than a code that
# resolves to something the detector never actually emits.
#
# This covers all 31 European species on that list.
#
# `scientific_name` tracks current taxonomic consensus (Mammal Diversity Database / ASM "Bat
# Species of the World"), not necessarily the WA page's own naming -- verified 2026-09-16 against
# every entry in this file plus taxa_na.yaml, the only change found being the three Old World
# Eptesicus species below now filed under the resurrected genus Cnephaeus (2023 revision). Each
# `codes` entry's own value is untouched by this: it's a source's own literal vocabulary (the WA
# page's alpha code, or a classifier model's actual output string), resolved by exact
# (source, code) lookup -- never derived from `scientific_name` -- so renaming this field cannot
# break a code mapping, even where a `codes` literal still says "Eptesicus" because that's what
# the model itself emits.
#
# `battybirdnet` codes below map BattyBirdNET-Analyzer's EU checkpoint labels, which is a
# genuinely different (BirdNET-derived) species set, not scoped to the Wildlife Acoustics list
# above. It also emits Pipistrellus maderensis and Rhinolophus blasii, neither of which is on the
# Wildlife Acoustics list -- both are added below anyway (with only a `battybirdnet` code, no
# `emt`) since they're real, verified species this classifier can genuinely detect; common names
# cross-checked against Wikipedia, not hand-entered. A species this classifier can emit that
# isn't listed at all (rather than one listed here without a code) still lands in the
# unmapped-species review queue by design, same as any other unrecognized label.
#
# `iucn2022` codes are each species' name in the IUCN Red List 2022-2 range layer
# (https://data-gis.unep-wcmc.org/server/rest/services/Hosted/IUCN_Red_List/MapServer/0), used
# only by the optional range plausibility check. They equal `scientific_name` except where IUCN
# still files a species under its pre-2023 name (the three Old World Cnephaeus species are
# Eptesicus there). Like every code here they are looked up by exact match, never derived from
# `scientific_name`; a species with no `iucn2022` code simply shows "no range data".
taxa:
  - scientific_name: Pipistrellus pipistrellus
    rank: species
    common_name_de: Zwergfledermaus
    common_name_en: Common pipistrelle
    codes: {emt: PIPPIP, batdetect2: "Pipistrellus pipistrellus", battybirdnet: "Pipistrellus pipistrellus", iucn2022: "Pipistrellus pipistrellus"}
  - scientific_name: Pipistrellus pygmaeus
    rank: species
    common_name_de: Mückenfledermaus
    common_name_en: Soprano pipistrelle
    codes: {emt: PIPPYG, batdetect2: "Pipistrellus pygmaeus", battybirdnet: "Pipistrellus pygmaeus", iucn2022: "Pipistrellus pygmaeus"}
  - scientific_name: Pipistrellus nathusii
    rank: species
    common_name_de: Rauhautfledermaus
    common_name_en: Nathusius' pipistrelle
    codes: {emt: PIPNAT, batdetect2: "Pipistrellus nathusii", battybirdnet: "Pipistrellus nathusii", iucn2022: "Pipistrellus nathusii"}
  - scientific_name: Pipistrellus kuhlii
    rank: species
    common_name_de: Weißrandfledermaus
    common_name_en: Kuhl's pipistrelle
    codes: {emt: PIPKUH, battybirdnet: "Pipistrellus kuhlii", iucn2022: "Pipistrellus kuhlii"}
  - scientific_name: Pipistrellus maderensis
    rank: species
    common_name_de: Madeira-Fledermaus
    common_name_en: Madeira pipistrelle
    # Not on the Wildlife Acoustics list this file is otherwise scoped to (no
    # `emt` code) -- BattyBirdNET-Analyzer's EU checkpoint emits it, so it's
    # added here rather than left permanently unmapped.
    codes: {battybirdnet: "Pipistrellus maderensis", iucn2022: "Pipistrellus maderensis"}
  - scientific_name: Nyctalus noctula
    rank: species
    common_name_de: Abendsegler
    common_name_en: Common noctule
    codes: {emt: NYCNOC, batdetect2: "Nyctalus noctula", battybirdnet: "Nyctalus noctula", iucn2022: "Nyctalus noctula"}
  - scientific_name: Nyctalus leisleri
    rank: species
    common_name_de: Kleinabendsegler
    common_name_en: Leisler's bat
    codes: {emt: NYCLEI, batdetect2: "Nyctalus leisleri", battybirdnet: "Nyctalus leisleri", iucn2022: "Nyctalus leisleri"}
  - scientific_name: Nyctalus lasiopterus
    rank: species
    common_name_de: Riesenabendsegler
    common_name_en: Greater noctule bat
    codes: {emt: NYCLAS, battybirdnet: "Nyctalus lasiopterus", iucn2022: "Nyctalus lasiopterus"}
  - scientific_name: Cnephaeus serotinus
    rank: species
    common_name_de: Breitflügelfledermaus
    common_name_en: Serotine
    # `codes` values are each source's own literal vocabulary, not derived from
    # `scientific_name` -- batdetect2/battybirdnet still emit "Eptesicus serotinus"
    # (their training data predates this 2023 revision), so those literals stay
    # as-is even though `scientific_name` above reflects current consensus.
    codes: {emt: EPTSER, batdetect2: "Eptesicus serotinus", battybirdnet: "Eptesicus serotinus", iucn2022: "Eptesicus serotinus"}
  - scientific_name: Cnephaeus isabellinus
