# North American (USA/Canada) bat taxa and the Wildlife Acoustics codes the
# Echo Meter Touch emits.
#
# Codes are verified against the authoritative Wildlife Acoustics list:
# https://answers.wildlifeacoustics.com/r/en-US/Bat-Auto-ID-Performance-and-Supported-Species/Bat-Auto-ID-Supported-Species-and-Abbreviated-Codes
#
# That list is SPECIES-LEVEL ONLY — it defines no genus or group codes. Do not
# invent one. An unmapped label resolves to None and lands in the review queue
# by design (spec section 5), which is a far better failure than a code that
# resolves to something the detector never actually emits.
#
# This covers all 38 USA/Canada species on that list.
#
# scientific_name always matches the WA page's own naming, since that is the
# vocabulary this project's code source is keyed against — even where current
# taxonomy has moved on (noted per-entry below where that happened).
# common_name_en favors the standard, most commonly used English name from
# Wikipedia/IUCN/ASM Mammal Diversity Database, which is sometimes not
# word-for-word what the WA page prints; deviations are noted below.
# common_name_de is included only where German Wikipedia has a genuine,
# dedicated article under a German common-name title (not a mere mention
# inside a genus article, and not a redirect target) — most North American
# species do not have an established German common name, unlike the European
# ones, and the key is omitted for those rather than inventing a translation.
#
# `iucn2022` codes are each species' name in the IUCN Red List 2022-2 range layer
# (https://data-gis.unep-wcmc.org/server/rest/services/Hosted/IUCN_Red_List/MapServer/0), used
# only by the optional range plausibility check. They equal `scientific_name` except where IUCN
# still files a species under its pre-2023 name (the three Old World Cnephaeus species are
# Eptesicus there). Like every code here they are looked up by exact match, never derived from
# `scientific_name`; a species with no `iucn2022` code simply shows "no range data".
taxa:
  - scientific_name: Antrozous pallidus
    rank: species
    common_name_de: Wüstenfledermaus
    common_name_en: Pallid bat
    codes: {emt: ANTPAL, iucn2022: "Antrozous pallidus"}
  - scientific_name: Corynorhinus townsendii
    rank: species
    common_name_de: Townsend-Langohr
    common_name_en: Townsend's big-eared bat
    codes: {emt: CORTOW, iucn2022: "Corynorhinus townsendii"}
  - scientific_name: Eptesicus fuscus
