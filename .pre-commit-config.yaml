# Without this, a hook with no explicit `stages:` runs at EVERY installed git
# hook type — since both `pre-commit` and `commit-msg` are installed here,
# every hook below except the commit-msg one (which sets its own `stages:`)
# would otherwise run twice per commit, doubling the full test suite's cost.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # Same pinned env `hatch fmt`/`hatch run ruff:ruff` both resolve to
        # (pyproject.toml's [tool.hatch.envs.ruff]) — not a separate mirror
        # repo's own install, so there is exactly one ruff version in play.
        entry: hatch run ruff:ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: hatch run ruff:ruff format
        language: system
        types: [python]
      - id: yaml-check
        name: yaml check (syntax + duplicate keys)
        entry: hatch run python scripts/check_yaml.py
        language: system
        types: [yaml]
      - id: mypy
        name: mypy
        entry: hatch run types:check
        language: system
        pass_filenames: false
      - id: tests
        name: tests (excl. db)
        # DB-marked tests spin up a fresh PostGIS testcontainer each run, which
        # dominates wall-clock time and needs Docker (blocked by the sandbox
        # here besides). Run the full suite, incl. -m db, as a separate step
        # before merging -- see CLAUDE.md's Environment gotchas section.
        entry: hatch test -m "not db"
        language: system
        pass_filenames: false
      - id: commit-msg-conventional
        name: commit message follows Conventional Commits
        entry: hatch run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
