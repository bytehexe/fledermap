[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fledermap"
dynamic = ["version"]
description = "Map-first organiser for bat recordings from handheld detectors"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Janna Hopp" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "sqlalchemy>=2.0.16",
  "geoalchemy2",
  "shapely",
  "alembic",
  "psycopg2-binary",
  "click",
  "pyyaml",
  "numpy",
  "pyproj",
  "scipy",
  "scikit-learn",
  "scikit-maad",
  "platformdirs",
  "pillow",
  "flask",
  # Apache-2.0, no extras/opt-in ceremony needed (unlike batdetect2/battybirdnet) --
  # sunrise/sunset/moon-phase astronomical calculations for the RTC widget (design spec
  # 2026-09-26-fledermap-rtc-widget-design.md).
  "astral",
  # Pinned to a minor range, not left open: `jobs/app.py`'s `ensure_schema`
  # reaches into `app.schema_manager.get_schema()` (a semi-internal surface)
  # to work around a confirmed upstream bug in `apply_schema()`, and it only
  # ever APPLIES the schema -- it never runs Procrastinate's own versioned
  # migrations, so a library upgrade needs a deliberate, manual schema step.
  "procrastinate>=3.9,<4",
  "psycopg[binary,pool]",
  "watchdog",
  # Upper-bounded like procrastinate above, same reasoning: init_if_new()
  # hashes the models' DDL and drops+recreates every table in
  # poiidx_bats_db on any mismatch, so a library upgrade needs a deliberate,
  # manual step -- not something a routine dependency bump should trigger
  # (final review, 2026-08-28).
  "poiidx>=0.0.9,<0.1",
  # A plain HTTP client for the (optional, off-by-default) BattyBirdNET-Analyzer
  # classifier integration -- Fledermap only ever POSTs to a server the operator
  # runs and builds themselves; no BattyBirdNET code is imported, vendored, or
  # bundled, so this carries none of batdetect2's CC-BY-NC extras-group ceremony
  # (design spec 2026-09-16-fledermap-battybirdnet-classifier-design.md §1).
  "requests",
]

# CC-BY-NC-4.0-licensed, non-commercial use only (https://pypi.org/project/batdetect2/).
# Deliberately NOT a base dependency: a plain `pip install fledermap` must never pull in a
# restrictively-licensed model. See docs/superpowers/specs/2026-09-15-fledermap-batdetect2-
# classifier-design.md §1. Enabling FLEDERMAP_BATDETECT2_ENABLED without this extra installed
# fails the classification job at run time (see jobs/tasks.py's classify_batdetect2_task) --
# it does not block the rest of the application.
#
# `audioread` is listed explicitly because batdetect2's own `types.py` imports it directly at
# module load time, but batdetect2 never declares it as a dependency -- it relied on librosa
# pulling it in transitively, which was true for older librosa releases but is no longer true
# for the version pip resolves today (librosa dropped the hard `audioread` dependency). Without
# this, `from batdetect2 import api` fails with `ModuleNotFoundError: No module named
# 'audioread'` before any of batdetect2's own code runs.
#
# The upper bound is not routine caution: two separate things here are coupled to one
# release line. The `codes.batdetect2` values in `src/fledermap/store/taxa_eu.yaml` are the
# class-name strings of one specific model checkpoint, so a checkpoint whose vocabulary
# differs silently resolves fewer species (or none). And `classify_batdetect2_task` parses
# `api.process_file`'s return value structurally -- a dict with "pred_dict"."annotation",
# each annotation carrying "class"/"class_prob"/"det_prob" -- which is not a documented,
# stability-guaranteed API. Bumping past this bound means re-checking both against the real
# package, the same way they were established in the first place.
[project.optional-dependencies]
batdetect2 = ["batdetect2>=1.3,<2", "audioread"]

[project.scripts]
fledermap = "fledermap.cli.main:cli"

[tool.hatch.version]
path = "src/fledermap/__about__.py"
source = "vcs"

[tool.hatch.version.vcs]
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/fledermap/__about__.py"

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "pytest>=7.0.0",
  "testcontainers>=4.15.0",
]

[tool.hatch.envs.types]
# pytest and testcontainers both ship inline types; without them here mypy
# cannot resolve `import pytest` / `import testcontainers.community.postgres`
# in the test files, and the tempting fix — a global ignore_missing_imports — would
# blind-spot every third-party import in the project. PyYAML/shapely/scipy
# don't ship inline types either -- their separate stub packages (exact
# names taken from mypy's own "Hint:" suggestions, not guessed) were
# apparently present in some earlier, undeclared state of this env but were
# never captured here; a `hatch env remove types` + recreate exposed the gap
# (found 2026-08-28 while executing the dark-mode plan -- unrelated to that
# feature, a pre-existing repo/env drift caught along the way).
extra-dependencies = [
  "mypy>=1.0.0",
  "pytest>=7.0.0",
  "testcontainers>=4.15.0",
  "types-PyYAML",
  "types-shapely",
  "scipy-stubs",
  "types-requests",
]

[tool.hatch.envs.types.scripts]
# `scripts` used to need --explicit-package-bases + MYPYPATH=src: it held
# fetch_vendor_assets.py, cross-imported by a test as `scripts.fetch_vendor_assets`,
# which mypy resolved to two different module names ("Source file found twice
# under different module names"). That code has since moved into the
# installed package (src/fledermap/services/vendor_assets.py) -- scripts/ is
# dev-only tooling (git hooks) that was never part of a built wheel, and code
# `serve` needs at runtime cannot live somewhere that never ships. The two
# scripts remaining in `scripts/` are invoked via subprocess by their tests,
# never imported, so the collision -- and the flags that worked around it --
# no longer apply.
check = "mypy --install-types --non-interactive {args:src/fledermap tests scripts}"

[tool.hatch.envs.ruff]
skip-install = true
detached = true
extra-dependencies = ["ruff==0.16.4"]

# `hatch fmt` runs this env, which by default injects hatch's OWN bundled ruff
# config (an older pinned version, 120-column line length) on top of ours —
# disagreeing with `[tool.hatch.envs.ruff]` above (this project's own pinned
# version, 88-column default) on both lint rules and formatting. `config-path
# = "none"` disables that injection so this env falls back to the project's
# own `[tool.ruff]` below, and pinning the same version as the `ruff` env
# makes `hatch fmt`, `hatch run ruff:ruff`, and pre-commit produce identical
# output. Do not add `extend` to `[tool.ruff]` — hatch's docs warn it defeats
# `config-path = "none"`.
[tool.hatch.envs.hatch-static-analysis]
config-path = "none"
dependencies = ["ruff==0.16.4"]

[tool.hatch.envs.mkdocs]
skip-install = true
detached = true
dependencies = [
  # mkdocs-material's own team warns 2.0 removes the plugin/theming system
  # entirely with no migration path and is currently unlicensed for
  # production use -- pin the 1.x line deliberately rather than picking it
  # up on a future `hatch env remove mkdocs`.
  "mkdocs-material>=9,<10",
]

[tool.hatch.envs.mkdocs.scripts]
serve = "mkdocs serve"
build = "mkdocs build --strict"

[tool.hatch.envs.batdetect2]
features = ["batdetect2"]
# The test deps are here so `tests/test_batdetect2_real_api.py` -- the one test that
# runs the real model instead of a mock of it -- can actually be executed somewhere:
# `hatch run batdetect2:pytest tests/test_batdetect2_real_api.py`. It skips itself in
# every other env (`pytest.importorskip`), and without pytest installed HERE it would
# have no env left to run in at all. `testcontainers` is needed only because
# `tests/conftest.py` imports it at module scope during collection; nothing in this
# env's test starts a container.
extra-dependencies = [
  "pytest>=7.0.0",
  "testcontainers>=4.15.0",
]

# scikit-learn ships no `py.typed` marker and there is no `types-scikit-learn`
# stub package, so mypy cannot resolve it by any other means. A SCOPED override
# is the correct fix here, unlike the global `ignore_missing_imports` rejected
# above — this one blind-spots exactly one package, named explicitly.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

# scikit-maad ships no `py.typed` marker and there is no stub package for it
# either -- same scoped-override reasoning as sklearn.* above.
[[tool.mypy.overrides]]
module = "maad.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "db: requires a PostGIS container",
]

[tool.ruff]
# Docs are prose deliverables. Ruff formats Python code fences inside markdown,
# which would rewrite the committed spec and plan documents.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "A", "COM", "ANN"]
ignore = ["E501", "COM812", "ANN401"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-bugbear]
# SpectrogramParams/OscillogramParams are frozen dataclasses (immutable), so
# it's safe to call them in a default argument. Mirrors the scoped override
# pattern established by sklearn mypy config: a small exception over
# reworking code around a linter's limitation.
extend-immutable-calls = [
  "fledermap.media.spectrogram.SpectrogramParams",
  "fledermap.media.oscillogram.OscillogramParams",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source_pkgs = ["fledermap", "tests"]
branch = true
parallel = true
omit = ["src/fledermap/__about__.py"]
