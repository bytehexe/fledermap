name: Deploy MkDocs to GitHub Pages

on: push

jobs:
  publish-docs:
    name: Deploy docs to GitHub Pages 📚
    # A tagged-release workflow is in progress (the "github+pypi release"
    # backlog item, feat/pypi-release-workflow) but not merged/live yet --
    # until it is, nothing ever pushes a tag here, so this job simply never
    # runs. Once tagging starts for real, revisit whether non-prerelease
    # tags should be filtered separately.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install "mkdocs-material>=9,<10"
      - run: mkdocs build --strict
      - name: Upload static files as artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
